# Publishes https://aicor-solutions.github.io/cramera/ from every push to main: the viewer with
# the small medical laboratory cramera-laboratory ships, and a status page that shows the
# version, the commit, the build time and a screenshot of the viewer taken in this build.
# A build whose viewer does not show its scene fails, so the site keeps the last working
# build. Pull requests run the same build without publishing it, so a change that breaks
# the site fails before it is merged.
# The questions plugin's browser module is included without krrood and cramera-bridge: on
# the static site it shows the answers recorded in each bundle's recorded_answers.json,
# which cramera-bridge's cramera-record-answers writes in a CRAM workspace.
# The Shared Sim tab embeds the Robot Lobby that https://yxzhan.github.io/robot-lobby/ publishes.
name: Publish the demo site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, so a pull request's build never cancels the publishing of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  SCENES: packages/plugins/laboratory/src/cramera_laboratory/resources
  DEFAULT_SCENE: aicor_medical_lab

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the viewer, the questions plugin and the Shared Sim tab
        run: pip install ./packages/protocol ./packages/viewer ./packages/questions ./packages/plugins/shared-sim

      - name: Export the site with the medical laboratory
        run: >
          cramera-export-site site
          --scenes "$SCENES"
          --default-scene "$DEFAULT_SCENE"
          --plugin questions
          --plugin shared-sim
          --commit "$GITHUB_SHA"
          --source "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"

      - name: Take the screenshot the status page shows
        run: |
          mkdir -p site/status
          python -m http.server 8000 --bind 127.0.0.1 &
          export PATH="$CHROMEWEBDRIVER:$PATH"
          cramera-shot "http://127.0.0.1:8000/site/" site/status/viewer.png \
            --browser chrome --timeout 180 --report site/status/viewer.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
