# Runs every package's tests on its own, as CRAM's rules ask, with the coverage floor
# of 85 %, and checks that the Python code is formatted. CI has no CRAM workspace, so
# cramera-questions, cramera-bridge and the plan builder run only their tests without
# CRAM, measured over the modules those tests reach.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: protocol
            module: cramera_protocol
          - package: viewer
            module: cramera
          - package: questions
            install: -e ./packages/questions
            coverage: >-
              --cov=cramera_questions.exceptions
              --cov=cramera_questions.plugin
          - package: bridge
            install: -e ./packages/bridge
            coverage: >-
              --cov=cramera_bridge.database.runs
              --cov=cramera_bridge.demo_script
              --cov=cramera_bridge.documents
              --cov=cramera_bridge.laboratory.command
              --cov=cramera_bridge.export.scene_index
              --cov=cramera_bridge.live.activity
              --cov=cramera_bridge.live.marker_topics
              --cov=cramera_bridge.live.query_steps
              --cov=cramera_bridge.live.recording
              --cov=cramera_bridge.live.segments
              --cov=cramera_bridge.plans.objects
              --cov=cramera_bridge.questions.matching
              --cov=cramera_bridge.questions.presets
              --cov=cramera_bridge.questions.recorded.bundle
              --cov=cramera_bridge.questions.recorded.urdf
              --cov=cramera_bridge.scenes.presentation
          # The converter's tests need usd-core; the viewer is installed as well, so
          # the screenshot step is tested.
          - package: usd
            module: cramera_usd
            install: -e './packages/usd[test]' usd-core
          - package: plugins/offline
            module: cramera_offline
            install: -e ./packages/plugins/offline
          - package: plugins/scene-runs
            module: cramera_scene_runs
            install: -e ./packages/plugins/scene-runs
          - package: plugins/shared-sim
            module: cramera_shared_sim
            install: -e ./packages/plugins/shared-sim
          - package: plugins/laboratory
            module: cramera_laboratory
            install: -e './packages/plugins/laboratory[physics]' -e ./packages/bridge
          - package: plugins/scene-builder
            module: cramera_scene_builder
            install: -e './packages/plugins/scene-builder[e57]'
          # CI has no CRAM workspace, so the plan builder's tests against it are not
          # collected and the coverage is measured over the modules that need none.
          - package: plugins/plan-builder
            install: -e ./packages/plugins/plan-builder
            coverage: >-
              --cov=cramera_plan_builder.constraints
              --cov=cramera_plan_builder.demos
              --cov=cramera_plan_builder.environments
              --cov=cramera_plan_builder.exceptions
              --cov=cramera_plan_builder.plans
              --cov=cramera_plan_builder.plugin
              --cov=cramera_plan_builder.routes
              --cov=cramera_plan_builder.runs
              --cov=cramera_plan_builder.workspace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install the packages and the test tools
        run: pip install -e ./packages/protocol -e ./packages/viewer ${{ matrix.install }} -r requirements-development.txt

      - name: Run the tests with coverage
        working-directory: packages/${{ matrix.package }}
        run: python -m pytest -q ${{ matrix.coverage || format('--cov={0}', matrix.module) }} --cov-report=term-missing --cov-fail-under=85 test

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the formatters
        run: pip install -r requirements-development.txt typing_extensions

      - name: Check that black and docformatter change nothing
        run: |
          python scripts/format_python.py
          git diff --exit-code
