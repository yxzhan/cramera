<!doctype html>
<html lang="en" data-viewer-state="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cramera</title>
  <link rel="icon" href="images/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles/viewer.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/",
        "three/examples/jsm/": "./vendor/three/examples/jsm/",
        "urdf-loader": "./vendor/urdf-loader/src/URDFLoader.js"
      }
    }
  </script>
  <script type="module" src="app/main.js"></script>
</head>
<body class="scene-page">
  <header class="topbar" id="site-header" data-page="scene"></header>

  <main class="split" id="split">
    <section class="card scene-card" aria-label="Scene">
      <div class="card-head">
        <h2>Semantic Digital Twin Scene</h2>
        <nav class="scene-picker" id="scene-picker" aria-label="Scene"></nav>
      </div>
      <section class="stage" id="stage" aria-label="3D scene">
        <div class="layers" id="layers" aria-label="Layers"></div>
        <p class="viewer-status status-line" id="status-line" role="status" aria-live="polite">Loading…</p>
        <div class="stage-message" id="stage-message" hidden></div>
        <button type="button" class="live-badge" id="live-badge" hidden>● LIVE</button>
        <p class="stage-hint"><span class="pointer-hint">drag orbit · scroll zoom · right-drag pan · click selects · double-click or F focuses</span><span class="touch-hint">drag orbit · pinch zoom · two-finger pan · tap selects</span></p>
        <button type="button" class="pop-out" id="pop-out" title="Open the scene alone in a window of its own">⧉ Pop out</button>
      </section>
      <footer class="workflow" id="timeline" aria-label="Playback"></footer>
    </section>

    <div class="split-divider" id="split-divider" role="separator" aria-orientation="vertical" aria-label="Resize the columns" title="Drag to resize · double-click for halves"></div>

    <aside class="column" id="column" aria-label="Questions and panels">
      <section class="card query-slot" id="query-slot" hidden></section>
      <div class="row-divider" id="row-divider" role="separator" aria-orientation="horizontal" aria-label="Resize the query slot" title="Drag to resize · double-click to reset"></div>
      <section class="card tabs-slot" id="side-panels" aria-label="Panels"></section>
    </aside>
  </main>
</body>
</html>
